; PicoVR Dongle firmware: XIAO ESP32-C3 (any ESP32-C3 board with native USB).
; Shares src/network/picolink.h with the tracker firmware.
[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform = espressif32 @ 6.7.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.1
  framework-arduinoespressif32-libs @ https://github.com/espressif/arduino-esp32/releases/download/3.0.1/esp32-arduino-libs-3.0.1.zip
board = seeed_xiao_esp32c3
framework = arduino
build_flags =
  -I../src/network
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Nothing but protocol frames on the USB port.
  -DCORE_DEBUG_LEVEL=0
  -O2
build_unflags = -Os
